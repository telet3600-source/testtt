kind = "web"
previewPath = "/"
title = "Garage SaaS — نظام إدارة محلات الصيانة"
version = "1.0.0"
id = "artifacts/garage-saas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24105

[services.development]
run = "pnpm --filter @workspace/garage-saas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/garage-saas", "run", "build" ]
publicDir = "artifacts/garage-saas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24105"
BASE_PATH = "/"
