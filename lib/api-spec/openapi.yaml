openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Garage SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: customers
  - name: vehicles
  - name: orders
  - name: invoices
  - name: technicians
  - name: reviews
  - name: reports
  - name: portal
  - name: dashboard
  - name: superadmin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH (Staff) ─────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: staffLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLoginResult"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: staffLogout
      tags: [auth]
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getStaffMe
      tags: [auth]
      responses:
        "200":
          description: Current staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "401":
          description: Unauthorized

  # ── PORTAL (Customer) ─────────────────────────────────────────────────────────
  /portal/login:
    post:
      operationId: portalLogin
      tags: [portal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalLoginResult"

  /portal/logout:
    post:
      operationId: portalLogout
      tags: [portal]
      responses:
        "200":
          description: Logged out

  /portal/me:
    get:
      operationId: getPortalMe
      tags: [portal]
      responses:
        "200":
          description: Current customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCustomer"

  /portal/change-password:
    post:
      operationId: portalChangePassword
      tags: [portal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed

  /portal/orders:
    get:
      operationId: getPortalOrders
      tags: [portal]
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /portal/orders/{id}:
    get:
      operationId: getPortalOrder
      tags: [portal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"

  /portal/orders/{id}/approve:
    post:
      operationId: portalApproveOrder
      tags: [portal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Approval recorded

  /portal/vehicles:
    get:
      operationId: getPortalVehicles
      tags: [portal]
      responses:
        "200":
          description: Customer vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /portal/vehicles/{id}/history:
    get:
      operationId: getPortalVehicleHistory
      tags: [portal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle maintenance history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleHistory"

  /portal/balance:
    get:
      operationId: getPortalBalance
      tags: [portal]
      responses:
        "200":
          description: Customer balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerBalance"

  /portal/reviews:
    post:
      operationId: createPortalReview
      tags: [portal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created

  # ── PUBLIC TRACKING ─────────────────────────────────────────────────────────
  /track/{token}:
    get:
      operationId: trackOrder
      tags: [orders]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingInfo"

  # ── DASHBOARD ────────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/orders-pipeline:
    get:
      operationId: getOrdersPipeline
      tags: [dashboard]
      responses:
        "200":
          description: Orders by stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersPipeline"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/upcoming-deliveries:
    get:
      operationId: getUpcomingDeliveries
      tags: [dashboard]
      responses:
        "200":
          description: Cars ready for delivery
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  # ── CUSTOMERS ────────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Customers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"

    post:
      operationId: createCustomer
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

    put:
      operationId: updateCustomer
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

    delete:
      operationId: deleteCustomer
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /customers/{id}/vehicles:
    get:
      operationId: getCustomerVehicles
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /customers/{id}/orders:
    get:
      operationId: getCustomerOrders
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /customers/{id}/balance:
    get:
      operationId: getCustomerBalance
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer balance and debt info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerBalance"

  # ── VEHICLES ──────────────────────────────────────────────────────────────────
  /vehicles:
    get:
      operationId: getVehicles
      tags: [vehicles]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Vehicles list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

    post:
      operationId: createVehicle
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDetail"

    put:
      operationId: updateVehicle
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}/oil-records:
    get:
      operationId: getVehicleOilRecords
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Oil change records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OilRecord"

    post:
      operationId: createOilRecord
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OilRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OilRecord"

  # ── WORK ORDERS ───────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: technicianId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"

    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"

    put:
      operationId: updateOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Status updated

  /orders/{id}/services:
    post:
      operationId: addOrderService
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderServiceInput"
      responses:
        "201":
          description: Service added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderService"

  /orders/{id}/services/{serviceId}:
    delete:
      operationId: removeOrderService
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed

  /orders/{id}/parts:
    post:
      operationId: addOrderPart
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPartInput"
      responses:
        "201":
          description: Part added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPart"

  /orders/{id}/parts/{partId}:
    delete:
      operationId: removeOrderPart
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed

  /orders/{id}/invoice:
    post:
      operationId: issueInvoice
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Invoice issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /orders/{id}/tracking-link:
    get:
      operationId: getOrderTrackingLink
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tracking link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingLink"

  # ── INVOICES ─────────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: getInvoices
      tags: [invoices]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Invoices list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/payments:
    get:
      operationId: getInvoicePayments
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payments for invoice
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

    post:
      operationId: addPayment
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # ── TECHNICIANS ───────────────────────────────────────────────────────────────
  /technicians:
    get:
      operationId: getTechnicians
      tags: [technicians]
      responses:
        "200":
          description: Technicians list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Technician"

    post:
      operationId: createTechnician
      tags: [technicians]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"

  /technicians/{id}:
    get:
      operationId: getTechnician
      tags: [technicians]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Technician detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"

    put:
      operationId: updateTechnician
      tags: [technicians]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"

  /technicians/{id}/orders:
    get:
      operationId: getTechnicianOrders
      tags: [technicians]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Technician orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /technicians/{id}/stats:
    get:
      operationId: getTechnicianStats
      tags: [technicians]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Technician statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechnicianStats"

  # ── REVIEWS ───────────────────────────────────────────────────────────────────
  /reviews:
    get:
      operationId: getReviews
      tags: [reviews]
      responses:
        "200":
          description: All reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /reviews/stats:
    get:
      operationId: getReviewStats
      tags: [reviews]
      responses:
        "200":
          description: Review statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStats"

  /reviews/{id}/reply:
    post:
      operationId: replyToReview
      tags: [reviews]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewReplyInput"
      responses:
        "200":
          description: Reply posted

  # ── REPORTS ───────────────────────────────────────────────────────────────────
  /reports/financial:
    get:
      operationId: getFinancialReport
      tags: [reports]
      parameters:
        - name: period
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Financial report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialReport"

  /reports/technicians-performance:
    get:
      operationId: getTechPerformanceReport
      tags: [reports]
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Technician performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechPerformance"

  /reports/debts:
    get:
      operationId: getDebtReport
      tags: [reports]
      responses:
        "200":
          description: Outstanding debts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtReport"

  # ── SUPER ADMIN ───────────────────────────────────────────────────────────────
  /superadmin/login:
    post:
      operationId: superAdminLogin
      tags: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperAdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAdminLoginResult"

  /superadmin/tenants:
    get:
      operationId: getTenants
      tags: [superadmin]
      responses:
        "200":
          description: All tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"

    post:
      operationId: createTenant
      tags: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /superadmin/tenants/{id}:
    get:
      operationId: getTenant
      tags: [superadmin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

    put:
      operationId: updateTenant
      tags: [superadmin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /superadmin/stats:
    get:
      operationId: getSuperAdminStats
      tags: [superadmin]
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAdminStats"

  /seed:
    post:
      operationId: seedData
      tags: [health]
      responses:
        "200":
          description: Seeded

